<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17243d">
<title>Pending PO • Online</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#1a2741;background:#f2f7ff}
*{box-sizing:border-box}
body{margin:0;background:#f2f7ff}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
input,select{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:11px;background:white;margin:5px 0 12px;color:#14233b}
input:focus,select:focus{outline:2px solid #93c5fd}
label{font-size:13px;font-weight:700;color:#334155}
h1{font-size:26px;margin:0 0 18px}
h2{font-size:19px;margin:0 0 15px}
h3{font-size:16px}
small,.muted,.dim{color:#64748b;font-size:13px}
button.primary,.primary{background:linear-gradient(135deg,#2677e8,#1154bc);color:white;border:0;border-radius:11px;padding:11px 16px;font-weight:700;box-shadow:0 6px 16px #185cc321}
button.primary:hover{filter:brightness(1.05)}
.secondary{background:#e2e8f0;color:#21324c;border:0;border-radius:9px;padding:11px 14px;font-weight:650}
.danger{background:#fee2e2;color:#b91c1c;border:0;border-radius:9px;padding:9px 12px;border:none}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.hidden{display:none!important}

.layout{display:flex;min-height:calc(100vh - 68px)}
header{height:68px;background:white;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:2}
.brand{font-size:20px;font-weight:900;letter-spacing:-.6px}
aside{width:220px;flex:none;background:linear-gradient(180deg,#153e72,#0d2e5d);padding:15px 10px}
nav button{display:block;width:100%;border:0;border-radius:10px;background:transparent;color:#dbeafe;text-align:left;padding:13px;margin:3px 0}
nav button.on,nav button:hover{background:#1c67bb;color:#fff}
main{padding:24px;flex:1;min-width:0;background:#f2f7ff}
.page{display:none}.page.on{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.card,.panel{background:white;border:1px solid #dbe7f9;border-radius:14px;padding:18px;box-shadow:0 3px 14px #164b9d0a}
.panel{margin-top:17px;overflow-x:auto}
.value{font-size:30px;font-weight:900;margin-top:8px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{border-bottom:1px solid #e2e8f0;padding:11px 10px;font-size:13px;text-align:left;vertical-align:top}
th{background:#f8fafc;color:#475569}
tr:hover td{background:#fafcff}
.pill{display:inline-block;border-radius:99px;padding:4px 9px;background:#fef3c7;color:#92400e;font-size:12px;font-weight:750}
.pill.done{background:#dcfce7;color:#166534}
.notice{padding:12px;border-radius:10px;background:#eaf2ff;color:#1d4ed8;margin-bottom:16px;font-size:13px}
.notice.warn{background:#fff7ed;color:#9a3412}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.itemrow{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:9px;align-items:center}
.modal{position:fixed;inset:0;background:#0f172a99;display:none;place-items:center;padding:14px;z-index:10}
.modal.on{display:grid}
.modalbox{width:min(750px,100%);max-height:92vh;overflow:auto;background:white;border-radius:18px;padding:20px;box-shadow:0 25px 70px #0005}
.modalhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}
.modalhead h2{margin:0}
.close{border:0;background:transparent;font-size:28px}
.mutelist{padding:9px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.toolbarinput{max-width:300px;margin:0}
.status{font-size:12px;padding:7px 10px;border-radius:8px;background:#eaf2ff;color:#1d4ed8}
#toast{position:fixed;bottom:20px;right:20px;max-width:380px;padding:13px 16px;border-radius:12px;background:#13243e;color:white;z-index:100;box-shadow:0 8px 40px #0004;display:none}

@media(max-width:750px){
  header{height:auto;min-height:68px;padding:8px 12px;gap:8px;flex-wrap:wrap}
  .brand{font-size:17px}
  aside{width:57px;padding:10px 4px}
  nav button{padding:11px 5px;text-align:center;font-size:20px}
  nav .navtext{display:none}
  main{padding:12px}
  h1{font-size:23px}
  .grid2{grid-template-columns:1fr}
  .itemrow{grid-template-columns:1.5fr .75fr .75fr auto}
}
</style>
</head>
<body>

<div id="app">
  <header>
    <span class="brand">📦 PENDING PO <span style="color:#2563eb">ONLINE</span></span>
    <div class="btnrow" style="margin:0;gap:6px">
      <span id="syncStatus" class="status">Menghubungkan...</span>
    </div>
  </header>
  <div class="layout">
    <aside>
      <nav id="navigation">
        <button data-page="dashboard" class="on">🏠 <span class="navtext">Dashboard</span></button>
        <button data-page="po">📋 <span class="navtext">Data PO</span></button>
        <button data-page="pending">⏳ <span class="navtext">Pending PO</span></button>
        <button data-page="master">⚙️ <span class="navtext">Pengaturan</span></button>
      </nav>
    </aside>
    <main>
      <section id="dashboard" class="page on">
        <h1>Dashboard</h1>
        <div class="cards">
          <div class="card"><div class="dim">Total PO</div><div id="dpo" class="value">0</div></div>
          <div class="card"><div class="dim">Total Qty & Bonus</div><div id="dqty" class="value">0</div></div>
          <div class="card"><div class="dim">Pending PO</div><div id="dpend" class="value">0</div></div>
        </div>
        <div class="panel">
          <div class="notice">Semua PO tersimpan online di Supabase. Rincian item memuat Type Barang, Qty, dan Bonus.</div>
          <div class="btnrow"><button class="secondary" data-refresh>↻ Refresh Data</button></div>
        </div>
      </section>

      <section id="po" class="page">
        <h1>Data PO</h1>
        <div class="panel">
          <div class="btnrow">
            <button class="primary" id="addPO">＋ Tambah PO Baru</button>
            <button class="secondary" data-refresh>↻ Refresh</button>
          </div>
          <div id="poList" class="tablewrap"></div>
        </div>
      </section>

      <section id="pending" class="page">
        <h1>Pending PO</h1>
        <div class="panel">
          <div class="btnrow"><button class="secondary" data-refresh>↻ Refresh</button></div>
          <div id="pendingList" class="tablewrap"></div>
        </div>
      </section>

      <section id="master" class="page">
        <h1>Pengaturan Master</h1>
        <div class="grid2">
          <div class="panel" style="margin-top:0">
            <h2>📦 Type Barang</h2>
            <form id="addTypeForm">
              <input name="name" placeholder="Nama Type Barang Baru" required maxlength="150">
              <button class="primary" type="submit">Tambah Type</button>
            </form>
            <div id="typesList" style="margin-top:15px"></div>
          </div>
          <div class="panel" style="margin-top:0">
            <h2>👤 Sales</h2>
            <form id="addSalesForm">
              <input name="name" placeholder="Nama Sales Baru" required maxlength="150">
              <button class="primary" type="submit">Tambah Sales</button>
            </form>
            <div id="salesList" style="margin-top:15px"></div>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>

<div id="modal" class="modal">
  <div class="modalbox">
    <div class="modalhead">
      <h2 id="modalTitle">Form</h2>
      <button class="close" id="closeModal">×</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>
<div id="toast"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
