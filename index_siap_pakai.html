<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17243d">
<title>Pending PO • Online</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#1a2741;background:#f2f7ff}
*{box-sizing:border-box}
body{margin:0;background:#f2f7ff}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
input,select{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:11px;background:white;margin:5px 0 12px;color:#14233b}
input:focus,select:focus{outline:2px solid #93c5fd}
label{font-size:13px;font-weight:700;color:#334155}
h1{font-size:26px;margin:0 0 18px}
h2{font-size:19px;margin:0 0 15px}
h3{font-size:16px}
small,.muted,.dim{color:#64748b;font-size:13px}
button.primary,.primary{background:linear-gradient(135deg,#2677e8,#1154bc);color:white;border:0;border-radius:11px;padding:11px 16px;font-weight:700;box-shadow:0 6px 16px #185cc321}
button.primary:hover{filter:brightness(1.05)}
.secondary{background:#e2e8f0;color:#21324c;border:0;border-radius:9px;padding:11px 14px;font-weight:650}
.danger{background:#fee2e2;color:#b91c1c;border:0;border-radius:9px;padding:9px 12px;border:none}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.hidden{display:none!important}

.layout{display:flex;min-height:calc(100vh - 68px)}
header{height:68px;background:white;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:2}
.brand{font-size:20px;font-weight:900;letter-spacing:-.6px}
aside{width:220px;flex:none;background:linear-gradient(180deg,#153e72,#0d2e5d);padding:15px 10px}
nav button{display:block;width:100%;border:0;border-radius:10px;background:transparent;color:#dbeafe;text-align:left;padding:13px;margin:3px 0}
nav button.on,nav button:hover{background:#1c67bb;color:#fff}
main{padding:24px;flex:1;min-width:0;background:#f2f7ff}
.page{display:none}.page.on{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.card,.panel{background:white;border:1px solid #dbe7f9;border-radius:14px;padding:18px;box-shadow:0 3px 14px #164b9d0a}
.panel{margin-top:17px;overflow-x:auto}
.value{font-size:30px;font-weight:900;margin-top:8px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{border-bottom:1px solid #e2e8f0;padding:11px 10px;font-size:13px;text-align:left;vertical-align:top}
th{background:#f8fafc;color:#475569}
tr:hover td{background:#fafcff}
.pill{display:inline-block;border-radius:99px;padding:4px 9px;background:#fef3c7;color:#92400e;font-size:12px;font-weight:750}
.pill.done{background:#dcfce7;color:#166534}
.notice{padding:12px;border-radius:10px;background:#eaf2ff;color:#1d4ed8;margin-bottom:16px;font-size:13px}
.notice.warn{background:#fff7ed;color:#9a3412}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.itemrow{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:9px;align-items:center}
.modal{position:fixed;inset:0;background:#0f172a99;display:none;place-items:center;padding:14px;z-index:10}
.modal.on{display:grid}
.modalbox{width:min(750px,100%);max-height:92vh;overflow:auto;background:white;border-radius:18px;padding:20px;box-shadow:0 25px 70px #0005}
.modalhead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}
.modalhead h2{margin:0}
.close{border:0;background:transparent;font-size:28px}
.mutelist{padding:9px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.toolbarinput{max-width:300px;margin:0}
.status{font-size:12px;padding:7px 10px;border-radius:8px;background:#eaf2ff;color:#1d4ed8}
#toast{position:fixed;bottom:20px;right:20px;max-width:380px;padding:13px 16px;border-radius:12px;background:#13243e;color:white;z-index:100;box-shadow:0 8px 40px #0004;display:none}

@media(max-width:750px){
  header{height:auto;min-height:68px;padding:8px 12px;gap:8px;flex-wrap:wrap}
  .brand{font-size:17px}
  aside{width:57px;padding:10px 4px}
  nav button{padding:11px 5px;text-align:center;font-size:20px}
  nav .navtext{display:none}
  main{padding:12px}
  h1{font-size:23px}
  .grid2{grid-template-columns:1fr}
  .itemrow{grid-template-columns:1.5fr .75fr .75fr auto}
}
</style>
</head>
<body>

<div id="app">
  <header>
    <span class="brand">📦 PENDING PO <span style="color:#2563eb">ONLINE</span></span>
    <div class="btnrow" style="margin:0;gap:6px">
      <span id="syncStatus" class="status">Menghubungkan...</span>
    </div>
  </header>
  <div class="layout">
    <aside>
      <nav id="navigation">
        <button data-page="dashboard" class="on">🏠 <span class="navtext">Dashboard</span></button>
        <button data-page="po">📋 <span class="navtext">Data PO</span></button>
        <button data-page="pending">⏳ <span class="navtext">Pending PO</span></button>
        <button data-page="master">⚙️ <span class="navtext">Pengaturan</span></button>
      </nav>
    </aside>
    <main>
      <section id="dashboard" class="page on">
        <h1>Dashboard</h1>
        <div class="cards">
          <div class="card"><div class="dim">Total PO</div><div id="dpo" class="value">0</div></div>
          <div class="card"><div class="dim">Total Qty & Bonus</div><div id="dqty" class="value">0</div></div>
          <div class="card"><div class="dim">Pending PO</div><div id="dpend" class="value">0</div></div>
        </div>
        <div class="panel">
          <div class="notice">Semua PO tersimpan online di Supabase. Rincian item memuat Type Barang, Qty, dan Bonus.</div>
          <div class="btnrow"><button class="secondary" data-refresh>↻ Refresh Data</button></div>
        </div>
      </section>

      <section id="po" class="page">
        <h1>Data PO</h1>
        <div class="panel">
          <div class="btnrow">
            <button class="primary" id="addPO">＋ Tambah PO Baru</button>
            <button class="secondary" data-refresh>↻ Refresh</button>
          </div>
          <div id="poList" class="tablewrap"></div>
        </div>
      </section>

      <section id="pending" class="page">
        <h1>Pending PO</h1>
        <div class="panel">
          <div class="btnrow"><button class="secondary" data-refresh>↻ Refresh</button></div>
          <div id="pendingList" class="tablewrap"></div>
        </div>
      </section>

      <section id="master" class="page">
        <h1>Pengaturan Master</h1>
        <div class="grid2">
          <div class="panel" style="margin-top:0">
            <h2>📦 Type Barang</h2>
            <form id="addTypeForm">
              <input name="name" placeholder="Nama Type Barang Baru" required maxlength="150">
              <button class="primary" type="submit">Tambah Type</button>
            </form>
            <div id="typesList" style="margin-top:15px"></div>
          </div>
          <div class="panel" style="margin-top:0">
            <h2>👤 Sales</h2>
            <form id="addSalesForm">
              <input name="name" placeholder="Nama Sales Baru" required maxlength="150">
              <button class="primary" type="submit">Tambah Sales</button>
            </form>
            <div id="salesList" style="margin-top:15px"></div>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>

<div id="modal" class="modal">
  <div class="modalbox">
    <div class="modalhead">
      <h2 id="modalTitle">Form</h2>
      <button class="close" id="closeModal">×</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://vmxcolgppjxitbilruxg.supabase.co";
const SUPABASE_KEY = "Sb_publishable_1U7AieGT23hFHZTxB5yNog_N4pwtcSj";

let supabase = null;
let state = { pos: [], itemTypes: [], sales: [] };

document.addEventListener('DOMContentLoaded', () => {
  setupNavigation();
  setupEventListeners();
  initSupabase();
});

async function initSupabase() {
  try {
    if (!window.supabase) {
      alert('Koneksi internet diperlukan untuk memuat library Supabase. Pastikan HP terhubung ke internet.');
      return;
    }
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    await initApp();
  } catch (err) {
    alert('Gagal menghubungkan ke Supabase: ' + err.message);
  }
}

async function initApp() {
  if (!supabase) return;
  try {
    await loadItemTypes();
    await loadSales();
    await loadPOData();
    renderMasterTypes();
    renderSalesList();
    document.getElementById('syncStatus').textContent = '🟢 Online (Supabase)';
  } catch(err) {
    alert('Koneksi Supabase gagal: ' + err.message);
  }
}

async function loadItemTypes() {
  const { data, error } = await supabase.from('item_types').select('*').order('name', { ascending: true });
  if (error) throw error;
  if (data) state.itemTypes = data;
}

async function loadSales() {
  const { data, error } = await supabase.from('sales').select('*').order('name', { ascending: true });
  if (error) throw error;
  if (data) state.sales = data;
}

async function loadPOData() {
  const { data, error } = await supabase
    .from('pos')
    .select(`
      *,
      po_items (
        id,
        item_type_id,
        qty,
        bonus,
        item_types ( id, name )
      )
    `)
    .order('created_at', { ascending: false });

  if (error) throw error;

  state.pos = data || [];
  renderDashboard();
  renderPOTable();
  renderPendingTable();
}

function renderDashboard() {
  document.getElementById('dpo').textContent = state.pos.length;
  
  let totalQty = 0;
  let totalBonus = 0;
  let pendingCount = 0;
  
  state.pos.forEach(p => {
    if (p.status === 'Pending PO') pendingCount++;
    (p.po_items || []).forEach(i => {
      totalQty += (i.qty || 0);
      totalBonus += (i.bonus || 0);
    });
  });

  document.getElementById('dqty').textContent = `${totalQty} (+${totalBonus} Bonus)`;
  document.getElementById('dpend').textContent = pendingCount;
}

function renderPOTable() {
  const container = document.getElementById('poList');
  if (!container) return;

  if (state.pos.length === 0) {
    container.innerHTML = '<p class="dim">Belum ada data PO. Klik "+ Tambah PO Baru" untuk membuat pesanan.</p>';
    return;
  }

  let html = `
    <table>
      <thead>
        <tr>
          <th>No. PO</th>
          <th>Toko / Klien</th>
          <th>Kota</th>
          <th>Rincian Barang, Qty & Bonus</th>
          <th>Ekspedisi</th>
          <th>Status</th>
          <th class="no-print">Aksi</th>
        </tr>
      </thead>
      <tbody>
  `;

  state.pos.forEach(po => {
    const itemsSummary = (po.po_items || []).map(i => {
      const typeName = i.item_types?.name || 'Barang';
      const bonusText = i.bonus > 0 ? ` <span style="color:#2563eb;font-weight:bold">(+Bonus: ${i.bonus})</span>` : '';
      return `• ${escapeHtml(typeName)}: <b>${i.qty}</b> pcs${bonusText}`;
    }).join('<br>');

    html += `
      <tr>
        <td><b>${escapeHtml(po.po_number)}</b></td>
        <td>${escapeHtml(po.customer_name || '-')}</td>
        <td>${escapeHtml(po.city || '-')}</td>
        <td>${itemsSummary || '-'}</td>
        <td>${escapeHtml(po.expedition_main || '-')}${po.expedition_transit ? ' (Transit: ' + escapeHtml(po.expedition_transit) + ')' : ''}</td>
        <td><span class="pill ${po.status === 'Selesai' ? 'done' : ''}">${escapeHtml(po.status)}</span></td>
        <td class="no-print">
          <button class="danger" onclick="deletePO(${po.id})">Hapus</button>
        </td>
      </tr>
    `;
  });

  html += '</tbody></table>';
  container.innerHTML = html;
}

function renderPendingTable() {
  const container = document.getElementById('pendingList');
  if (!container) return;

  const pendingPos = state.pos.filter(p => p.status === 'Pending PO');
  if (pendingPos.length === 0) {
    container.innerHTML = '<p class="dim">Tidak ada pesanan status Pending PO saat ini.</p>';
    return;
  }

  let html = `
    <table>
      <thead>
        <tr>
          <th>No. PO</th>
          <th>Toko / Klien</th>
          <th>Kota</th>
          <th>Barang & Bonus Pending</th>
          <th>Ekspedisi Utama</th>
        </tr>
      </thead>
      <tbody>
  `;

  pendingPos.forEach(po => {
    const itemsSummary = (po.po_items || []).map(i => {
      const typeName = i.item_types?.name || 'Barang';
      const bonusText = i.bonus > 0 ? ` (+Bonus: ${i.bonus})` : '';
      return `• ${escapeHtml(typeName)}: <b>${i.qty}</b> pcs${bonusText}`;
    }).join('<br>');

    html += `
      <tr>
        <td><b>${escapeHtml(po.po_number)}</b></td>
        <td>${escapeHtml(po.customer_name || '-')}</td>
        <td>${escapeHtml(po.city || '-')}</td>
        <td>${itemsSummary || '-'}</td>
        <td>${escapeHtml(po.expedition_main || '-')}</td>
      </tr>
    `;
  });

  html += '</tbody></table>';
  container.innerHTML = html;
}

document.getElementById('addPO')?.addEventListener('click', () => {
  const autoPoNum = 'PO-' + new Date().toISOString().slice(0,10).replace(/-/g,'') + '-' + Math.floor(100 + Math.random() * 900);
  
  showModal('Tambah Purchase Order (PO)', `
    <form id="poForm">
      <label>Nomor PO</label>
      <input type="text" name="po_number" value="${autoPoNum}" required>

      <div class="grid2">
        <div>
          <label>Nama Toko / Klien</label>
          <input type="text" name="customer_name" placeholder="Contoh: Toko Tunas Baru" required>
        </div>
        <div>
          <label>Kota Tujuan</label>
          <input type="text" name="city" placeholder="Contoh: Jember" required>
        </div>
      </div>

      <div class="grid2">
        <div>
          <label>Ekspedisi Utama</label>
          <input type="text" name="expedition_main" placeholder="Contoh: Sinar Madu / Indah Cargo">
        </div>
        <div>
          <label>Ekspedisi Transit (Opsional)</label>
          <input type="text" name="expedition_transit" placeholder="Contoh: Jaya Mas">
        </div>
      </div>

      <h3 style="margin-top:15px;margin-bottom:8px">Rincian Type Barang, Qty & Bonus</h3>
      <div id="itemsContainer"></div>
      <button type="button" class="secondary" id="addItemBtn" style="margin-bottom:15px">＋ Tambah Baris Barang</button>

      <div style="text-align:right;margin-top:15px">
        <button type="submit" class="primary">Simpan PO ke Supabase</button>
      </div>
    </form>
  `);

  const container = document.getElementById('itemsContainer');
  const addItemRow = () => {
    const row = document.createElement('div');
    row.className = 'itemrow';
    row.style.marginBottom = '8px';
    row.innerHTML = `
      <select name="item_type_id" required>
        <option value="">-- Pilih Type Barang --</option>
        ${state.itemTypes.map(t => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('')}
      </select>
      <input type="number" name="qty" placeholder="Qty" min="1" required>
      <input type="number" name="bonus" placeholder="Bonus" min="0" value="0">
      <button type="button" class="danger remove-item-btn" style="padding:8px 10px">✕</button>
    `;
    row.querySelector('.remove-item-btn').onclick = () => row.remove();
    container.appendChild(row);
  };

  addItemRow();
  document.getElementById('addItemBtn').onclick = () => addItemRow();

  document.getElementById('poForm').onsubmit = async (e) => {
    e.preventDefault();
    const form = e.target;
    
    const poNumber = form.po_number.value.trim();
    const customerName = form.customer_name.value.trim();
    const city = form.city.value.trim();
    const expeditionMain = form.expedition_main.value.trim();
    const expeditionTransit = form.expedition_transit.value.trim();

    const rows = container.querySelectorAll('.itemrow');
    const items = [];
    rows.forEach(r => {
      const typeId = r.querySelector('[name="item_type_id"]').value;
      const qty = parseInt(r.querySelector('[name="qty"]').value) || 0;
      const bonus = parseInt(r.querySelector('[name="bonus"]').value) || 0;
      if (typeId && qty > 0) {
        items.push({ item_type_id: parseInt(typeId), qty, bonus });
      }
    });

    if (items.length === 0) {
      alert('Masukkan minimal 1 baris Type Barang dengan Qty valid!');
      return;
    }

    try {
      const { data: newPo, error: poErr } = await supabase
        .from('pos')
        .insert([{
          po_number: poNumber,
          customer_name: customerName,
          city: city,
          expedition_main: expeditionMain,
          expedition_transit: expeditionTransit,
          status: 'Pending PO'
        }])
        .select()
        .single();

      if (poErr) throw poErr;

      const itemsToInsert = items.map(it => ({
        po_id: newPo.id,
        item_type_id: it.item_type_id,
        qty: it.qty,
        bonus: it.bonus
      }));

      const { error: itemErr } = await supabase
        .from('po_items')
        .insert(itemsToInsert);

      if (itemErr) throw itemErr;

      closeModal();
      showToast('PO & Rincian Bonus berhasil disimpan!');
      await loadPOData();
    } catch (err) {
      alert('Gagal menyimpan PO: ' + err.message);
    }
  };
});

function renderMasterTypes() {
  const container = document.getElementById('typesList');
  if (!container) return;

  container.innerHTML = state.itemTypes.map(t => `
    <div class="mutelist">
      <span>📦 ${escapeHtml(t.name)}</span>
      <button class="danger" onclick="deleteType(${t.id})">Hapus</button>
    </div>
  `).join('');
}

function renderSalesList() {
  const container = document.getElementById('salesList');
  if (!container) return;

  container.innerHTML = state.sales.map(s => `
    <div class="mutelist">
      <span>👤 ${escapeHtml(s.name)}</span>
      <button class="danger" onclick="deleteSales(${s.id})">Hapus</button>
    </div>
  `).join('');
}

document.getElementById('addTypeForm')?.addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = e.target.querySelector('input[name="name"]');
  const name = input.value.trim();
  if (!name) return;

  try {
    const { error } = await supabase.from('item_types').insert([{ name }]);
    if (error) alert('Gagal: ' + error.message);
    else {
      input.value = '';
      await loadItemTypes();
      renderMasterTypes();
      showToast('Type Barang ditambahkan');
    }
  } catch(err) {
    alert('Gagal menambah type: ' + err.message);
  }
});

document.getElementById('addSalesForm')?.addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = e.target.querySelector('input[name="name"]');
  const name = input.value.trim();
  if (!name) return;

  try {
    const { error } = await supabase.from('sales').insert([{ name }]);
    if (error) alert('Gagal: ' + error.message);
    else {
      input.value = '';
      await loadSales();
      renderSalesList();
      showToast('Sales ditambahkan');
    }
  } catch(err) {
    alert('Gagal menambah sales: ' + err.message);
  }
});

window.deletePO = async (id) => {
  if (!confirm('Yakin hapus PO ini?')) return;
  const { error } = await supabase.from('pos').delete().eq('id', id);
  if (!error) {
    showToast('PO dihapus');
    await loadPOData();
  }
};

window.deleteType = async (id) => {
  if (!confirm('Yakin hapus type ini?')) return;
  const { error } = await supabase.from('item_types').delete().eq('id', id);
  if (!error) {
    await loadItemTypes();
    renderMasterTypes();
    showToast('Type barang dihapus');
  }
};

window.deleteSales = async (id) => {
  if (!confirm('Yakin hapus sales ini?')) return;
  const { error } = await supabase.from('sales').delete().eq('id', id);
  if (!error) {
    await loadSales();
    renderSalesList();
    showToast('Sales dihapus');
  }
};

function showModal(title, bodyHtml) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modal').classList.add('on');
}

function closeModal() {
  document.getElementById('modal').classList.remove('on');
}

document.getElementById('closeModal')?.addEventListener('click', closeModal);

function showToast(msg) {
  const toast = document.getElementById('toast');
  if (!toast) return;
  toast.textContent = msg;
  toast.style.display = 'block';
  setTimeout(() => { toast.style.display = 'none'; }, 3000);
}

function escapeHtml(str) {
  return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function setupNavigation() {
  const buttons = document.querySelectorAll('#navigation button');
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      const pageId = btn.getAttribute('data-page');
      buttons.forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      document.querySelectorAll('.page').forEach(p => p.classList.remove('on'));
      document.getElementById(pageId)?.classList.add('on');
    });
  });
}

function setupEventListeners() {
  document.querySelectorAll('[data-refresh]').forEach(btn => {
    btn.onclick = () => initSupabase();
  });
}
</script>
</body>
</html>
